experiment:
  name: hog18_conf
  description: KCF with 18-channel HOG and confidence-controlled update

input:
  video_path: "D:/code/cpp/vs/myKCF/joaofaro/joao/source/d4.mp4"
  annotation_path: "D:/code/cpp/vs/myKCF/joaofaro/joao/source/d4.txt"

output:
  save_video: 0
  video_path: "D:/code/cpp/vs/myKCF/joaofaro/joao/run/runkcf_output.mp4"

tracker:
  fixed_window: 0
  multiscale: 1

features:
  hog:
    enabled: 1
    channels: 18
  cn:
    enabled: 0
    channels: 0
  lab:
    enabled: 0
  fusion:
    mode: concat

confidence:
  enabled: 1
  psr_exclusion_radius: 5
  eps: 0.000001
  warmup_frames: 5
  ema_alpha: 0.05
  medium_ema_alpha: 0.0
  low_ema_alpha: 0.0
  high_ratio: 0.95
  low_ratio: 0.60
  hard_low_ratio: 0.35
  medium_lr_factor: 0.30
  soft_low_position_damping: 1.00
  medium_scale_smoothing: 0.50
  hard_low_displacement_threshold: 0.50
  hard_low_position_damping: 0.50
