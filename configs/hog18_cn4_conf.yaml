experiment:
  name: hog18_cn4_conf
  description: KCF with 18-channel HOG, 4-channel CN, and confidence-controlled update

input:
  video_path: "D:/code/cpp/vs/myKCF/joaofaro/joao/source/d4.mp4"
  annotation_path: "D:/code/cpp/vs/myKCF/joaofaro/joao/source/d4.txt"

output:
  save_video: 0
  video_path: "D:/code/cpp/vs/myKCF/joaofaro/joao/run/runkcf_output.mp4"

tracker:
  fixed_window: 0
  multiscale: 1

features:
  hog:
    enabled: 1
    channels: 18
  cn:
    enabled: 1
    channels: 4
  lab:
    enabled: 0
  fusion:
    mode: concat

confidence:
  enabled: 1
  psr_exclusion_radius: 5
  eps: 0.000001
  warmup_frames: 5
  ema_alpha: 0.05
  medium_ema_alpha: 0.0
  high_ratio: 0.95
  low_ratio: 0.60
  medium_lr_factor: 0.30
  low_displacement_threshold: 0.50
  low_displacement_damping: 0.50
